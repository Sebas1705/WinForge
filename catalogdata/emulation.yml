sources:
  # ---- for any system
  - id: romhacking-hacks
    system: any
    kind: hacks
    name: "Romhacking.net: hacks"
    en: "The biggest collection of ROM hack patches, filterable by game and system."
    es: "La mayor colección de parches de ROM hacks, filtrable por juego y sistema."
    url: https://www.romhacking.net/hacks/
    base: true
  - id: romhacking-translations
    system: any
    kind: translations
    name: "Romhacking.net: translations"
    en: "Fan translations as patches, including many games that never left Japan."
    es: "Traducciones de fans en forma de parches, incluidos muchos juegos que no salieron de Japón."
    url: https://www.romhacking.net/translations/
    base: true
  - id: romhacking-homebrew
    system: any
    kind: homebrew
    name: "Romhacking.net: homebrew"
    en: "New games made by fans for old consoles, free to download."
    es: "Juegos nuevos hechos por fans para consolas antiguas, gratis."
    url: https://www.romhacking.net/homebrew/
  - id: archipelago
    system: any
    kind: randomizers
    name: "Archipelago"
    en: "Randomize many games together, even across friends playing different ones."
    es: "Aleatoriza muchos juegos a la vez, incluso entre amigos que juegan a títulos distintos."
    url: https://archipelago.gg/
    base: true
  - id: rompatcher
    system: any
    kind: tools
    name: "RomPatcher.js"
    en: "Apply a patch to your game in the browser. WinForge can also do it: see the patch tool above."
    es: "Aplica un parche a tu juego en el navegador. WinForge también puede: mira la herramienta de parches de arriba."
    url: https://www.marcrobledo.com/RomPatcher.js/
  - id: pdroms
    system: any
    kind: freegames
    name: "PDRoms"
    en: "Public-domain and homebrew games for many systems, shared by their authors."
    es: "Juegos de dominio público y homebrew para muchos sistemas, compartidos por sus autores."
    url: https://pdroms.de/
  - id: gamebrew
    system: any
    kind: community
    name: "GameBrew"
    en: "A wiki that catalogs homebrew games and apps for consoles and handhelds."
    es: "Una wiki que cataloga juegos y apps homebrew para consolas y portátiles."
    url: https://www.gamebrew.org/
  - id: itch-homebrew
    system: any
    kind: homebrew
    name: "itch.io: homebrew"
    en: "Free and paid games made for retro systems by independent developers."
    es: "Juegos gratis y de pago hechos para sistemas retro por desarrolladores independientes."
    url: https://itch.io/games/tag-homebrew

