# How to find each emulator on disk and start a game with it. Only emulators
# whose command line is known are listed; the others are never launched by
# WinForge (the game is still installed, and the page tells where it is).
run:
  mgba: {exes: [mGBA.exe], hints: [mgba], args: ["{file}"]}
  visual-boy-advance: {exes: [visualboyadvance-m.exe, vbam.exe], hints: [visualboyadvance, vba], args: ["{file}"]}
  sameboy: {exes: [SameBoy.exe, sameboy.exe], hints: [sameboy], args: ["{file}"]}
  mesen-2: {exes: [Mesen.exe], hints: [mesen], args: ["{file}"]}
  mesen: {exes: [Mesen.exe], hints: [mesen], args: ["{file}"]}
  fceux: {exes: [fceux64.exe, fceux.exe], hints: [fceux], args: ["{file}"]}
  project64: {exes: [Project64.exe], hints: [project64], args: ["{file}"]}
  melonds: {exes: [melonDS.exe], hints: [melonds], args: ["{file}"]}
  dolphin: {exes: [Dolphin.exe], hints: [dolphin], args: ["-b", "-e", "{file}"]}
  pcsx2: {exes: [pcsx2-qt.exe], hints: [pcsx2], args: ["-batch", "--", "{file}"]}
  ppsspp: {exes: [PPSSPPWindows64.exe, PPSSPPWindows.exe], hints: [ppsspp], args: ["{file}"]}
  cemu: {exes: [Cemu.exe], hints: [cemu], args: ["-g", "{file}"]}
  uzdoom: {exes: [uzdoom.exe], hints: [uzdoom], args: ["-iwad", "{file}"]}
  zandronum: {exes: [zandronum.exe], hints: [zandronum], args: ["-iwad", "{file}"]}
  applewin: {exes: [Applewin.exe], hints: [applewin], args: ["-d1", "{file}"]}
  scummvm: {exes: [scummvm.exe], hints: [scummvm], register: ["--add", "--recursive", "--path={dir}"]}
