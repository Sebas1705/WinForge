# Which systems each emulator plays, and where to find games for them. WinForge
# never downloads or hosts a game: every source is a link to the project's own
# page, and only places that distribute free games, homebrew, or patches (which
# hold no game data) are listed. Patches need the person's own copy of the game,
# which `base: true` makes the app say.
#
# Every url was opened when the entry was written. Kinds: homebrew (new games
# made for the system), freegames (free or open-source games), hacks (patches
# that change an existing game), translations, randomizers, tools, community.

