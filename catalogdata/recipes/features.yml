- id: feature-netfx3-on
  description: Turn on .NET Framework 3.5, which some older programs and installers still ask for (it may download files from Windows Update).
  admin: true
  check: |
    $f = Get-CimInstance Win32_OptionalFeature -Filter "Name='NetFx3'" -ErrorAction SilentlyContinue
    if ($f -and $f.InstallState -eq 1) { exit 0 } else { exit 1 }
  powershell: |
    $name = 'NetFx3'
    "Turning on $name (.NET Framework 3.5; this can take a few minutes and needs an internet connection) ..."
    dism.exe /online /enable-feature /featurename:$name /all /norestart
    $code = $LASTEXITCODE
    if ($code -eq 3010) { 'Restart Windows to finish turning on .NET Framework 3.5.'; exit 3010 }
    if ($code -ne 0) { 'Windows could not get the files for .NET Framework 3.5. Check the internet connection and Windows Update, then try again.' }
    exit $code

- id: feature-netfx3-off
  description: Turn off .NET Framework 3.5.
  admin: true
  check: |
    $f = Get-CimInstance Win32_OptionalFeature -Filter "Name='NetFx3'" -ErrorAction SilentlyContinue
    if (-not $f -or $f.InstallState -ne 1) { exit 0 } else { exit 1 }
  powershell: |
    $name = 'NetFx3'
    "Turning off $name (.NET Framework 3.5) ..."
    dism.exe /online /disable-feature /featurename:$name /norestart
    $code = $LASTEXITCODE
    if ($code -eq 3010) { 'Restart Windows to finish turning off .NET Framework 3.5.'; exit 3010 }
    exit $code
