name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The catalog points at other people's packages; they change without this
    # repository changing, so the verifier also runs weekly.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        # main.go embeds frontend/dist, so Go cannot compile without it.
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  # Windows is the only real target, so the detection code (registry, winget
  # export, elevation) is compiled and vetted there; this job proves the pure
  # logic also builds elsewhere.
  portable-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test ./internal/... ./catalogdata/...

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Verify every app against winget-pkgs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/winforge-verify -lock catalog.lock.json
      - name: Lock file is current
        # A changed installer host or hash shows up as a diff to review.
        run: git diff --exit-code -- catalog.lock.json || echo "::warning::catalog.lock.json is stale; run winforge-verify -lock and commit it"
