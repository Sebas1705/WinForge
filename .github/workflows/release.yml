name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
      - name: Build app and installer
        run: wails build -nsis -ldflags "-X main.version=${{ github.ref_name }}"
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "build/bin/WinForge.exe" "dist/WinForge-${{ github.ref_name }}-windows-amd64.exe"
          $installer = Get-ChildItem "build/bin" -Filter "*installer*.exe" | Select-Object -First 1
          if (-not $installer) { throw "no installer artifact found" }
          Copy-Item $installer.FullName "dist/WinForge-${{ github.ref_name }}-windows-installer.exe"
          Get-ChildItem dist | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Add-Content dist/SHA256SUMS
          }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
